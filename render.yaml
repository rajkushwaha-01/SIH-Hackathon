services:
  - type: web
    name: sih-sif-safety-intelligence
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: sih-sif-precursors
      - key: PINECONE_NAMESPACE
        value: safety-reports-v1
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "500"
